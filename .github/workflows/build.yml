name: Build KSU Next Samsung S938N

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patch/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  # ── Step 0: pin the KSU Next dev-branch HEAD so every job uses the same commit
  pin-commit:
    name: Pin KSU Next commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - id: pin
        run: |
          # Use the exact commit the KSU Next manager CI last built from (= what t.me/ksunext_ci has)
          SHA=$(curl -sf \
            "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/actions/workflows/build-manager-ci.yml/runs?status=success&per_page=1" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['workflow_runs'][0]['head_sha'])")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Pinned to KSU Next manager CI commit: $SHA"

  # ── Step 1: kernel module (needs DDK container) ──────────────────────────────
  build-module:
    name: Build kernelsu.ko (android15-6.6)
    runs-on: ubuntu-latest
    needs: pin-commit
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Clone KernelSU Next at pinned commit
        run: |
          git clone https://github.com/KernelSU-Next/KernelSU-Next ksu-next
          git -C ksu-next checkout ${{ needs.pin-commit.outputs.sha }}

      - name: Apply Samsung patches
        run: python3 patch/apply.py ksu-next

      - name: Build kernel module
        run: |
          cd ksu-next/kernel
          CONFIG_KSU=m \
          CONFIG_KSU_SAMSUNG_KDP=y \
          CONFIG_KSU_SAMSUNG_RKP=y \
          CONFIG_KSU_SAMSUNG_DEFEX=y \
          CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y \
          CC=clang make
          llvm-strip -d kernelsu.ko

      - name: Stage artifact
        run: |
          mkdir -p out
          cp ksu-next/kernel/kernelsu.ko out/android15-6.6_kernelsu.ko

      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-android15-6.6-lkm
          path: out/android15-6.6_kernelsu.ko

  # ── Step 2: ksuinit ──────────────────────────────────────────────────────────
  build-ksuinit:
    name: Build ksuinit
    runs-on: ubuntu-latest
    needs: pin-commit
    steps:
      - uses: actions/checkout@v4

      - name: Clone KernelSU Next at pinned commit
        run: |
          git clone https://github.com/KernelSU-Next/KernelSU-Next ksu-next
          git -C ksu-next checkout ${{ needs.pin-commit.outputs.sha }}

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ksu-next/userspace/ksuinit
          cache-targets: false

      - name: Build ksuinit
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          LLVM_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          CLANG_PATH="$LLVM_BIN/aarch64-linux-android26-clang"
          BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-aarch64-android.a"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG_PATH"
          export RUSTFLAGS="-C target-feature=+crt-static \
            -C link-arg=-Wl,-z,max-page-size=16384 \
            -C link-arg=-Wno-unused-command-line-argument \
            -C link-arg=$BUILTINS"
          cd ksu-next/userspace/ksuinit
          cargo build --target=aarch64-linux-android --release

      - uses: actions/upload-artifact@v4
        with:
          name: ksuinit-aarch64
          path: ksu-next/userspace/ksuinit/target/aarch64-linux-android/release/ksuinit

  # ── Step 3: ksud (depends on module + ksuinit) ───────────────────────────────
  build-ksud:
    name: Build ksud (Samsung-patched)
    runs-on: ubuntu-latest
    needs: [pin-commit, build-module, build-ksuinit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone KernelSU Next at pinned commit
        run: |
          git clone https://github.com/KernelSU-Next/KernelSU-Next ksu-next
          git -C ksu-next checkout ${{ needs.pin-commit.outputs.sha }}

      - name: Apply Samsung patches to Rust sources
        run: python3 patch/apply.py ksu-next

      - name: Setup Rust + cross
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          RUSTFLAGS="" cargo install cross \
            --git https://github.com/cross-rs/cross \
            --rev 66845c1 \
            --locked

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ksu-next/userspace/ksud
          cache-targets: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare embedded assets
        run: |
          mkdir -p ksu-next/userspace/ksud/bin/aarch64
          cp artifacts/aarch64-android15-6.6-lkm/android15-6.6_kernelsu.ko \
             ksu-next/userspace/ksud/bin/aarch64/
          cp artifacts/ksuinit-aarch64/ksuinit \
             ksu-next/userspace/ksud/bin/aarch64/ksuinit

      - name: Assemble LKM bootstrap object
        run: |
          clang --target=aarch64-linux-gnu -c -nostdlib \
            -o ksu-next/userspace/ksud/.lkm_image_bootstrap.o \
            ksu-next/userspace/ksud/src/lkm_image_bootstrap.S

      - name: Build ksud
        run: |
          CROSS_NO_WARNINGS=0 cross build \
            --target aarch64-linux-android \
            --release \
            --manifest-path ksu-next/userspace/ksud/Cargo.toml

      - name: Copy binary to repo and update manifest
        run: |
          cp ksu-next/userspace/ksud/target/aarch64-linux-android/release/ksud \
             kernelsu/ksud-s938n-next

          KSUD_SIZE=$(wc -c < kernelsu/ksud-s938n-next)
          echo "ksud size: $KSUD_SIZE bytes"

          python3 patch/update_manifest.py support/targets-v3.json "$KSUD_SIZE"

      - name: Commit and push artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kernelsu/ksud-s938n-next support/targets-v3.json
          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit"
          else
            git commit -m "ci: update KSU Next samsung s938n build [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ksud-s938n-next
          path: kernelsu/ksud-s938n-next
